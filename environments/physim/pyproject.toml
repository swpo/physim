[project]
name = "physim"
version = "0.11.0"
description = "physim — hidden-law world discovery: explore an anonymous-port dynamical system, then answer prediction contracts."
requires-python = ">=3.11"
dependencies = ["verifiers", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physim"]
