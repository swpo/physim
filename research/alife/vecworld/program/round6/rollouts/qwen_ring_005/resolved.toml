model = "qwen/qwen3.6-35b-a3b"
num_rollouts = 1
max_concurrent = 1
push = false

[sampling]
max_tokens = 8192

[env]
id = "physim2-verifier"

[env.taskset]
id = "physim2-env"
image = "physim2-ring:4"
instances = [
    "pilot-qwen-ring-005",
]

[env.taskset.task.limits]
max_context_tokens = 100000
cap_usd = 0.5
box_cpus = 2.0
box_memory_gb = 4.0

[env.taskset.task.spend]
cap_usd = 0.5
max_context_tokens = 100000
max_output_tokens = 8192
model = "qwen/qwen3.6-35b-a3b"
input_usd_per_mtok = 0.11
output_usd_per_mtok = 1.01
context_window = 262144
prices_from = "GET https://api.pinference.ai/api/v1/models (no credential sent) at unix time 1794448361"
billed = true
cache_read_usd_per_mtok = 0.099

[env.agent]
max_turns = 40

[env.agent.timeout]
rollout = 900.0

[env.agent.runtime]
type = "docker"
cpu = 2.0
memory = 4.0

[env.agent.harness]
id = "bash"
edit = true
search = false

[env.agent.retries]
max_retries = 0

[env.retries]
max_retries = 0

[env.verifier]
retries = 0

[client]
type = "eval"
base_url = "https://api.pinference.ai/api/v1"
api_key_var = "PRIME_API_KEY"
