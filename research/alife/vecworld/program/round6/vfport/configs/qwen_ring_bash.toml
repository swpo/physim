# SUPERSEDED IN ROUND 4. A model rollout is no longer started from a vf-eval config like this one: it is described
# by a FLAT rollout config (configs/ring_rollout.example.toml, schema physim2-rollout/v1; physim2_env/rollout_config.py
# expands it for the profile) and started by a request through tools/vfrun.py. The file below is round 3's, unchanged
# (image 1, 40 undisclosed turns, an old model id): kept only because round 3's check tools read it. Do not run it.
# ONE rollout of a cheap model on the ring smoke exam with the stock `bash` harness (a mechanics test, not a
# measurement). THIS RUN COSTS MONEY and puts an untrusted model into a container: the only command that may
# start it is the one in RUNBOOK_MAC.md, step 3, under its STOP line (run label, store path, output to a file,
# detached). Do not start it from this comment.
# The caps below bound the spend as long as the provider reports usage: 40 turns, 1.5 M tokens in total, 60 k
# output tokens (checked before each model call: the cap plus one request).
# Defaults of the taskset that matter here: single_use = true (this model and harness can open the instance once),
# item_isolation = "box" (every exam item is graded in a fresh container).
model = "qwen/qwen3.5-35b-a3b"   # id checked against Prime's Models API on 16 Sep 2026 (coordinator's note)
num_rollouts = 1
max_concurrent = 1
push = false

[sampling]
max_tokens = 8192

[env]
id = "isolated-verifier"

[env.taskset]
id = "physim2-env"
image = "physim2-ring:1"
instances = ["mac-ring-w0"]

[env.agent]
max_turns = 40
max_total_tokens = 1500000
max_output_tokens = 60000

[env.agent.timeout]
rollout = 3600                   # the ring config's envelope: one hour

[env.agent.runtime]
type = "docker"

[env.agent.harness]
id = "bash"
edit = true
search = false

[env.agent.retries]
max_retries = 0                  # a rerun would hand the agent a fresh laboratory budget

[env.retries]
max_retries = 0

[env.verifier]
retries = 0
