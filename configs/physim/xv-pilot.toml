# One bounded development rollout; inference is billed by Prime. No uploads.
model = "deepseek/deepseek-v4-flash"
num_tasks = 1
num_rollouts = 1
max_concurrent = 1
push = false
output_dir = "outputs/eval-preparation-20260913/xv/pilot"

[sampling]
temperature = 0.6
max_tokens = 8192

[env.taskset]
id = "physim"

[env.taskset.task]
output_root = "outputs/eval-preparation-20260913/xv/pilot-artifacts"
agent_image = "physim-agent:0.12.0"

[env.taskset.task.tools]
bundle = "outputs/eval-preparation-20260913/xv/bundle"
max_experiments = 12
max_total_tu = 500
max_validation_attempts = 8
max_submission_attempts = 8

[env.agent]
max_turns = 64
max_input_tokens = 1500000
max_output_tokens = 131072

[env.agent.harness]
id = "bash"
edit = true
search = false

[env.agent.runtime]
type = "docker"
image = "physim-agent:0.12.0"
workdir = "/workspace"
cpu = 1
memory = 1
allow = []

[env.agent.timeout]
setup = 180
rollout = 1800
finalize = 180
scoring = 900

[env.agent.retries]
max_retries = 0

[env.retries]
max_retries = 0
