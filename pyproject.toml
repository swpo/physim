[project]
name = "physim-development"
version = "0.1.0"
description = "Development workspace for the Physim residency taskset and blobkit"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = []

[tool.uv.workspace]
members = ["environments/physim", "packages/blobkit"]

[tool.uv.sources]
physim = { workspace = true }
blobkit = { workspace = true }

[dependency-groups]
dev = [
    "physim[hub,reference]",
    "build>=1.2",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "ruff==0.15.20",
]

[tool.ruff]
line-length = 120
extend-exclude = ["probes", "handoff", "docs", "docs_source", "packages/blobkit/blobkit", "build", "dist", "outputs"]

[tool.ruff.lint]
select = ["F", "I"]
ignore = ["F722", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
