model = "openai/gpt-5.6-sol"
num_tasks = 3
num_rollouts = 1
shuffle = false
max_concurrent = 128
verbose = false
rich = false
server = false
push = true

[env]
id = ""
max_concurrent_agents = 1

[env.taskset]
id = "physim"
difficulty = "D4"
tier = "tools"
seed0 = 2
max_turns = 40
n_per_stratum = 4

[env.taskset.task]
judges = []
tier = "chat"

[env.taskset.task.tools]
colocated = false

[env.taskset.task.tools.runtime]
type = "subprocess"

[env.timeout]

[env.retries]
max_retries = 0
include = []
exclude = []

[env.interception]
type = "elastic"
multiplex = 32

[env.scientist.harness]
id = "codex"
forward_env = []
tool_timeout = 600.0
skills = []
version = "0.146.1"
multi_agent = false

[env.scientist.harness.env]

[env.scientist.runtime]
allow = [
    "*",
]
block = []
type = "docker"
image = "python:3.11-slim"
workdir = "/app"

[env.scientist.timeout]

[env.scientist.retries]
max_retries = 0
include = []
exclude = []

[serve]
address = "tcp://127.0.0.1:5000"

[serve.pool]
type = "elastic"
multiplex = 128

[legacy.args]

[legacy.extra_env_kwargs]

[client]
base_url = "https://api.pinference.ai/api/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[client.headers]
X-Prime-Team-ID = "cm06pkxft000nem2k4cqh38jq"

[sampling]
