model = "openai/gpt-5.2"
num_tasks = 2
num_rollouts = 1
shuffle = false
max_concurrent = 128
verbose = false
rich = false
server = false
push = true

[env]
id = ""
max_concurrent_agents = 1

[env.taskset]
id = "physim"
difficulty = "D2"
seed0 = 0
max_turns = 100
n_per_stratum = 4

[env.taskset.task]
judges = []

[env.timeout]

[env.retries]
max_retries = 0
include = []
exclude = []

[env.interception]
type = "elastic"
multiplex = 32

[env.scientist.harness]
id = "null"
forward_env = []
tool_timeout = 600.0
skills = []

[env.scientist.harness.env]

[env.scientist.runtime]
type = "subprocess"

[env.scientist.timeout]

[env.scientist.retries]
max_retries = 0
include = []
exclude = []

[serve]
address = "tcp://127.0.0.1:5000"

[serve.pool]
type = "elastic"
multiplex = 128

[legacy.args]

[legacy.extra_env_kwargs]

[client]
base_url = "https://api.pinference.ai/api/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[client.headers]
X-Prime-Team-ID = "cm06pkxft000nem2k4cqh38jq"

[sampling]
